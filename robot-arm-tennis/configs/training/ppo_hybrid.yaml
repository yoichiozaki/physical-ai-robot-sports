# Hybrid RL (D, proposed): PPO chooses the shot (target x/y + speed) once per incoming ball;
# the physics layer (prediction, shot solver, online identification, gated residual) executes it.
run_name: ppo_hybrid
seed: 0
total_timesteps: 64000   # decisions (one per shot)
n_envs: 16
checkpoint_freq: 16000
ppo:
  n_steps: 128
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.97
  gae_lambda: 0.95
  ent_coef: 0.01
  clip_range: 0.2
  policy_kwargs: {net_arch: [64, 64]}
env:
  mode: hybrid
  conditions: [nominal, randomized]
  points_per_episode: 4
  adaptive: true
eval:
  freq: 8000
  episodes: 16
