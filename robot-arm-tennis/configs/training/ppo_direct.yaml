# Pure RL (C): PPO outputs the racket-face pitch/yaw and racket speed directly, i.e. it has to
# learn how the ball leaves the racket (no ballistic shot model). Interception still uses the
# physics layer (otherwise the robot would practically never touch the ball).
run_name: ppo_direct
seed: 0
total_timesteps: 48000
n_envs: 16
checkpoint_freq: 16000
ppo:
  n_steps: 128
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.97
  gae_lambda: 0.95
  ent_coef: 0.0
  clip_range: 0.2
  policy_kwargs: {net_arch: [64, 64], log_std_init: -0.5}
env:
  mode: direct
  conditions: [nominal, randomized]
  points_per_episode: 4
  adaptive: true
eval:
  freq: 8000
  episodes: 16
