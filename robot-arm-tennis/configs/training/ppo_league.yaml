# Self-play league (idea 1): warm start from the Hybrid AI D and keep playing against frozen
# snapshots of itself (PFSP) plus the scripted opponents (20 %). Pure win/loss reward: with two
# strong players, an in-court bonus would reward endless rallies instead of winning points.
run_name: ppo_league
seed: 1
total_timesteps: 96000   # decisions
n_envs: 14
checkpoint_freq: 16000
init_from: checkpoints/ppo_hybrid/best_model.zip
snapshot_every: 12000
ppo:
  n_steps: 128
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0002
  gamma: 0.97
  gae_lambda: 0.95
  ent_coef: 0.005
  clip_range: 0.2
  policy_kwargs: {net_arch: [64, 64]}
env:
  mode: hybrid
  conditions: [nominal, randomized]
  points_per_episode: 4
  in_bonus: 0.0
  adaptive: true
  league_dir: checkpoints/ppo_league/league
  p_scripted: 0.2
  p_latest: 0.4
  pfsp_power: 2.0
eval:
  episodes: 0
