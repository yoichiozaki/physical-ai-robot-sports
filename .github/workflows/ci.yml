name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [air-hockey, robot-arm-tennis]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: System packages (headless OpenGL, ffmpeg, Japanese fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6 libgl1 libegl1 ffmpeg \
            fonts-ipaexfont-gothic fonts-ipaexfont-mincho
      - name: Python dependencies (pinned lock, CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements/lock.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: python -m pytest -q
