# Main evaluation (Phase 8). Seeds 10000+ are disjoint from all training seeds; full 60 s
# matches (training used single points of <= 15 s); "unknown_*" conditions are never seen
# in training (held-out friction/restitution, faster opponents, stronger sensor noise).
output: results/eval_main
match_duration: 60
workers: 0
controllers:
  - {name: "A: Reactive", spec: reactive}
  - {name: "B: Physics", spec: physics}
  - {name: "B+: Physics+Rule", spec: physics_heuristic}
  - {name: "B*: Physics+Adapt", spec: physics_adaptive}
  - {name: "C: PPO (pure RL)", spec: "ppo:checkpoints/ppo_direct_s0/final_model.zip"}
  - {name: "D: Hybrid AI", spec: "hybrid:checkpoints/ppo_hybrid_s0/final_model.zip"}
  - {name: "D*: Hybrid AI+Adapt", spec: "hybrid_adaptive:checkpoints/ppo_hybrid_s0/final_model.zip"}
opponents: [stationary, random, reactive, defensive, aggressive]
conditions: [nominal, randomized, unknown_sticky, unknown_bouncy]
seeds: [10000, 10001, 10002, 10003, 10004, 10005, 10006, 10007, 10008, 10009,
        10010, 10011, 10012, 10013, 10014, 10015, 10016, 10017, 10018, 10019]
